name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Unit and e2e (Google blocked)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end (gtag stubbed, Google hosts asserted unused)
        run: npm run test:e2e
        env:
          CI: true
